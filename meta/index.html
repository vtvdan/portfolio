<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Meta</title>
  <link rel="stylesheet" href="../style.css">
  <script src="../global.js" type="module"></script>
  <script src="main.js" type="module"></script>
</head>
<body>
  <h1>Summary</h1>

  <!-- Target container for D3 -->
  <div id="stats"></div>
  <h2>Commits by time of day</h2>
  <div id="chart"></div>

  <!-- Selection count and language breakdown -->
  <p id="selection-count">No commits selected</p>
  <dl id="language-breakdown" class="stats"></dl>

  <dl id="commit-tooltip" class="info tooltip" hidden>
    <dt>Commit</dt>
    <dd>
        <a id="commit-link" href=""></a>
    </dd>

    <dt>Date</dt>
    <dd id="commit-date"></dd>

    <dt>Time</dt>
    <dd id="commit-time"></dd>

    <dt>Lines Edited</dt>
    <dd id="commit-lines"></dd>
  </dl>

</body>
</html>
